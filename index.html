<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#2563eb">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Tracking">
  <title>PeruFibra – Compartir Ubicación</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/1865/1865269.png">
  <link rel="icon" href="https://cdn-icons-png.flaticon.com/512/1865/1865269.png" type="image/x-icon">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
  <style>
    :root {
      --primary: #2563eb;
      --primary-dark: #1d4ed8;
      --bg: #f8fafc;
    }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: var(--bg); margin: 0; padding: 20px; color: #1e293b; }
    .card { background: white; border-radius: 20px; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.1), 0 8px 10px -6px rgba(0,0,0,0.1); padding: 24px; max-width: 450px; margin: 0 auto; position: relative; }
    .header { text-align: center; margin-bottom: 24px; }
    .header img { width: 64px; height: 64px; margin-bottom: 12px; }
    .header h1 { font-size: 1.5rem; font-weight: 700; margin: 0; color: #0f172a; }
    .input-group { margin-bottom: 20px; }
    label { display: block; font-size: 0.875rem; font-weight: 600; margin-bottom: 8px; color: #64748b; }
    input { width: 100%; padding: 12px 16px; border-radius: 12px; border: 2px solid #e2e8f0; font-size: 1rem; box-sizing: border-box; transition: border-color 0.2s; }
    input:focus { outline: none; border-color: var(--primary); }
    #btn-share { width: 100%; padding: 14px; border-radius: 12px; border: none; background: var(--primary); color: white; font-size: 1rem; font-weight: 600; cursor: pointer; transition: transform 0.1s, background 0.2s; display: flex; align-items: center; justify-content: center; gap: 8px; }
    #btn-share:active { transform: scale(0.98); }
    #btn-share.sharing { background: #ef4444; }
    #status { margin-top: 20px; padding: 12px; border-radius: 12px; font-size: 0.875rem; display: none; text-align: center; }
    .status-active { display: block !important; background: #f0fdf4; color: #166534; border: 1px solid #bbf7d0; }
    .status-error { display: block !important; background: #fef2f2; color: #991b1b; border: 1px solid #fecaca; }
    
    /* --- NUEVOS ESTILOS SELECTOR DE MAPA --- */
    .map-style-container { margin-top: 15px; border-top: 1px solid #eee; padding-top: 15px; }
    .map-select { width: 100%; padding: 10px; border-radius: 10px; border: 2px solid #e2e8f0; font-size: 0.9rem; background: white; }
    
    #map { height: 200px; border-radius: 16px; margin-top: 20px; background: #e5e7eb; border: 1px solid #e2e8f0; }
    .footer-info { margin-top: 20px; font-size: 0.75rem; color: #94a3b8; text-align: center; line-height: 1.5; }
    .btn-ordenes { margin-top: 10px; width: 100%; padding: 10px; border-radius: 10px; border: 1px solid var(--primary); background: white; color: var(--primary); font-weight: 600; cursor: pointer; }
  </style>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
</head>
<body>

  <div class="card">
    <div class="header">
      <img src="https://cdn-icons-png.flaticon.com/512/1865/1865269.png" alt="Logo">
      <h1>Compartir Ubicación</h1>
    </div>

    <div class="input-group">
      <label for="tech-name">Nombre del Técnico</label>
      <input type="text" id="tech-name" placeholder="Ej. Juan Pérez" autocomplete="name">
    </div>

    <button id="btn-share">
      <span>📡</span> Iniciar Transmisión
    </button>

    <div id="status"></div>

    <div id="map"></div>

    <div class="map-style-container">
      <label>Estilo del Mapa</label>
      <select id="map-style-select" class="map-select">
        <option value="carto">CartoDB Positron (Claro)</option>
        <option value="google">Google Maps (Estándar)</option>
      </select>
    </div>

    <button class="btn-ordenes" onclick="verOrdenes()">📋 Ver Mis Órdenes Asignadas</button>

    <div class="footer-info">
      La ubicación se actualiza automáticamente cada 30 segundos.<br>
      Mantén la aplicación abierta para asegurar el rastreo.
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    // --- CONFIGURACIÓN SUPABASE (ORIGINAL) ---
    const SUPABASE_URL = 'https://jxpeztieqwotfgswhzhx.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imp4cGV6dGllcXdvdGZnc3doemh4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzA4MzQ4MDQsImV4cCI6MjA4NjQxMDgwNH0.Hf-lbGlP2OmH7Uh2LNKqwHkwHDp7yQV6O73aXw5NCZk';
    const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let map, marker, watchId, isSharing = false;
    let userId = localStorage.getItem('gps_user_id') || 'u_' + Math.random().toString(36).substr(2, 9);
    localStorage.setItem('gps_user_id', userId);

    const nameInput = document.getElementById('tech-name');
    const btnShare = document.getElementById('btn-share');
    const statusDiv = document.getElementById('status');
    const styleSelect = document.getElementById('map-style-select');

    if(localStorage.getItem('gps_user_name')) {
      nameInput.value = localStorage.getItem('gps_user_name');
    }

    // --- CAPAS DE MAPA ---
    const layers = {
      carto: L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png'),
      google: L.tileLayer('https://mt1.google.com/vt/lyrs=m&x={x}&y={y}&z={z}')
    };
    let currentLayer = layers.carto;

    // --- INICIALIZACIÓN DE MAPA ---
    map = L.map('map', { zoomControl: false }).setView([-12.0464, -77.0428], 15);
    currentLayer.addTo(map);

    // Lógica para cambiar estilo sin recargar
    styleSelect.addEventListener('change', (e) => {
      map.removeLayer(currentLayer);
      currentLayer = layers[e.target.value];
      currentLayer.addTo(map);
    });

    // --- LÓGICA DE COMPARTIR (ORIGINAL) ---
    btnShare.addEventListener('click', () => {
      if (!isSharing) {
        const name = nameInput.value.trim();
        if (!name) return alert('Ingresa tu nombre');
        localStorage.setItem('gps_user_name', name);
        startTracking();
      } else {
        stopTracking();
      }
    });

    function startTracking() {
      if (!navigator.geolocation) return alert('GPS no soportado');
      isSharing = true;
      btnShare.classList.add('sharing');
      btnShare.innerHTML = '<span>🛑</span> Detener Transmisión';
      statusDiv.className = 'status-active';
      statusDiv.innerText = 'Buscando señal GPS...';

      watchId = navigator.geolocation.watchPosition(updatePos, handleError, {
        enableHighAccuracy: true,
        timeout: 10000,
        maximumAge: 0
      });
    }

    async function updatePos(pos) {
      const { latitude: lat, longitude: lng } = pos.coords;
      const name = nameInput.value.trim();

      if (!marker) {
        marker = L.marker([lat, lng]).addTo(map);
      } else {
        marker.setLatLng([lat, lng]);
      }
      map.panTo([lat, lng]);

      statusDiv.innerText = `Transmitiendo: ${new Date().toLocaleTimeString()}`;

      // ENVÍO A SUPABASE (LÓGICA ORIGINAL)
      await sb.from('user_locations').upsert({
        id: userId,
        nombre: name,
        lat,
        lng,
        updated_at: new Date().toISOString()
      });
    }

    function stopTracking() {
      navigator.geolocation.clearWatch(watchId);
      isSharing = false;
      btnShare.classList.remove('sharing');
      btnShare.innerHTML = '<span>📡</span> Iniciar Transmisión';
      statusDiv.className = '';
      statusDiv.innerText = '';
    }

    function handleError(err) {
      statusDiv.className = 'status-error';
      statusDiv.innerText = `Error GPS: ${err.message}`;
    }

    // INTERVALO DE SEGURIDAD 30S (ORIGINAL)
    setInterval(async () => {
      if (isSharing && marker) {
        const pos = marker.getLatLng();
        await sb.from('user_locations').upsert({
          id: userId,
          nombre: nameInput.value.trim(),
          lat: pos.lat,
          lng: pos.lng,
          updated_at: new Date().toISOString()
        });
      }
    }, 30000);

    // --- LÓGICA DE ÓRDENES ASIGNADAS (ORIGINAL) ---
    function verOrdenes() {
      document.getElementById('ordenes-modal').style.display = 'block';
    }
    function cerrarModal() {
      document.getElementById('ordenes-modal').style.display = 'none';
    }

    // --- LÓGICA PWA / INSTALACIÓN (ORIGINAL) ---
    let _installPrompt;
    window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        _installPrompt = e;
        const banner = document.createElement('div');
        banner.id = 'install-banner';
        banner.style = "background:var(--primary);color:white;padding:12px;border-radius:12px;margin-bottom:15px;display:flex;justify-content:space-between;align-items:center;";
        banner.innerHTML = `<span><span style="font-size:1.2rem;">📲</span> Instala la app</span><button onclick="installApp()" style="padding:6px 12px;border-radius:8px;border:none;background:white;color:var(--primary);font-weight:600;cursor:pointer;">Instalar</button>`;
        document.querySelector('.card').prepend(banner);
    });

    async function installApp(){
        if(!_installPrompt) return;
        _installPrompt.prompt();
        const result = await _installPrompt.userChoice;
        if(result.outcome === 'accepted'){
            document.getElementById('install-banner')?.remove();
            _installPrompt = null;
        }
    }
  </script>

  <div id="ordenes-modal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); z-index:9999; backdrop-filter: blur(4px);">
    <iframe src="https://tecsycom2026.github.io/ordenes_asignadas/" style="width:100%; height:100%; border:none;"></iframe>
    <button onclick="cerrarModal()" style="position:absolute; top:20px; right:20px; background:#ef4444; color:white; border:none; padding:10px 15px; border-radius:8px; font-weight:bold; cursor:pointer;">CERRAR X</button>
  </div>
</body>
</html>
