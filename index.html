<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0077b6">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Tracking">
  <title>PeruFibra – Compartir Ubicación</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/1865/1865269.png">
  <link rel="icon" href="https://cdn-icons-png.flaticon.com/512/1865/1865269.png" type="image/x-icon">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    *{box-sizing:border-box;margin:0;padding:0;}
    body{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:linear-gradient(135deg,#1a1a2e,#16213e,#0f3460);color:white;font-family:sans-serif;padding:20px;}
    .card{background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.15);border-radius:20px;padding:30px 24px;width:100%;max-width:360px;text-align:center;backdrop-filter:blur(10px);}
    .logo{font-size:48px;margin-bottom:10px;}
    h2{font-size:20px;margin-bottom:6px;font-weight:700;}
    .subtitle{font-size:13px;color:rgba(255,255,255,0.6);margin-bottom:24px;}
    select,input{width:100%;padding:12px 16px;border-radius:10px;border:1px solid rgba(255,255,255,0.2);background:rgba(255,255,255,0.1);color:white;font-size:15px;margin-bottom:12px;outline:none;cursor:pointer;}
    select option{background:#16213e;color:white;}
    select:focus,input:focus{border-color:rgba(255,255,255,0.5);background:rgba(255,255,255,0.15);}
    button{width:100%;padding:13px;border-radius:10px;border:none;background:linear-gradient(135deg,#00b4d8,#0077b6);color:white;font-size:15px;font-weight:bold;cursor:pointer;transition:opacity .2s;touch-action:manipulation;}
    button:hover{opacity:.9;}
    button:disabled{opacity:.5;cursor:not-allowed;}
    #status-panel{display:none;margin-top:4px;}
    .status-badge{display:inline-flex;align-items:center;gap:8px;background:rgba(40,167,69,0.2);border:1px solid #28a745;border-radius:30px;padding:8px 16px;font-size:13px;margin-bottom:16px;}
    .pulse{width:10px;height:10px;border-radius:50%;background:#28a745;animation:pulse 1.5s ease-in-out infinite;}
    @keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.5;transform:scale(1.3)}}
    .info-box{background:rgba(255,255,255,0.05);border-radius:12px;padding:14px;margin-bottom:12px;font-size:13px;text-align:left;}
    .info-box label{color:rgba(255,255,255,0.5);font-size:11px;display:block;margin-bottom:2px;}
    .info-box span{color:white;font-weight:600;}
    #stop-btn{background:linear-gradient(135deg,#e63946,#c1121f);margin-top:8px;}
    .error-msg{color:#ff6b6b;font-size:12px;margin-top:8px;min-height:18px;}
    #last-update{font-size:11px;color:rgba(255,255,255,0.4);margin-top:4px;}
    #wakelock-msg{font-size:11px;color:rgba(255,255,255,0.5);margin-bottom:8px;}
    #send-count{font-size:11px;color:rgba(255,255,255,0.4);margin-top:4px;}
  </style>
</head>
<body>
<div class="card">
  <div class="logo">🚗</div>
  <h2>Compartir Ubicación</h2>
  <p class="subtitle">PeruFibra – Seguimiento en tiempo real</p>

  <div id="login-panel">
    <select id="nombre-select"><option value="">Cargando técnicos...</option></select>
    <p class="error-msg" id="error-msg"></p>
    <button id="start-btn" onclick="startTracking()" disabled>Iniciar seguimiento</button>
  </div>

  <div id="status-panel">
    <div class="status-badge"><div class="pulse"></div><span>Ubicación activa</span></div>
    <div class="info-box">
      <label>Técnico</label>
      <span id="display-nombre">—</span>
    </div>
    <div class="info-box">
      <label>Última posición enviada</label>
      <span id="display-coords">Obteniendo GPS...</span>
      <div id="last-update"></div>
      <div id="send-count"></div>
    </div>
    <div id="wakelock-msg"></div>
    <button id="stop-btn" onclick="stopTracking()">Detener seguimiento</button>
  </div>
</div>

<script>
// ============================================
// 🔴 CONFIGURACIÓN SUPABASE (ORIGINAL - SIN CAMBIOS)
// ============================================
const SUPABASE_URL='https://jxpeztieqwotfgswhzhx.supabase.co';
const SUPABASE_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imp4cGV6dGllcXdvdGZnc3doemh4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzA4MzQ4MDQsImV4cCI6MjA4NjQxMDgwNH0.Hf-lbGlP2OmH7Uh2LNKqwHkwHDp7yQV6O73aXw5NCZk';
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

// Variables originales (SIN CAMBIOS)
let watchId=null, fallbackInterval=null, nombre='', _channel=null, _lista=[], _wakeLock=null, _sendCount=0;

// ✅ Variables NUEVAS para Android Nativo (no interfieren con lo original)
let androidAvailable = false;

// ============================================
// ✅ FUNCIÓN NUEVA: Recibir coordenadas desde Android Nativo
// (Se llama desde Kotlin vía webView.loadUrl("javascript:..."))
// ============================================
function actualizarUbicacion(lat, lng, accuracy) {
    console.log(`📍 Android Nativo: ${lat}, ${lng} (±${accuracy}m)`);
    // Reutiliza tu función original saveLocation para mantener compatibilidad con Supabase
    if (nombre) {
        saveLocation(lat, lng);
    }
}

// ============================================
// FUNCIONES ORIGINALES (SIN MODIFICAR LÓGICA VISUAL NI DE SUPABASE)
// ============================================
async function sbLoadG(t){
    const{data,error}=await sb.from(t).select('data').eq('id','global').single();
    if(error)return null;
    return data?.data??null;
}

window.addEventListener('load',async()=>{
    // ✅ Detectar si estamos en APK con AndroidInterface (nuevo, no afecta UI)
    if (window.AndroidInterface && typeof AndroidInterface.iniciarRastreo === 'function') {
        androidAvailable = true;
        console.log('✅ AndroidInterface detectado - GPS nativo disponible');
    }
    
    const fbTL=await sbLoadG('technician_list');
    const lista=Array.isArray(fbTL)?fbTL.sort():[];
    _lista=lista;

    const{data:activos}=await sb.from('user_locations').select('nombre');
    const ocupados=new Set((activos||[]).map(u=>u.nombre.toUpperCase()));

    const sel=document.getElementById('nombre-select');
    sel.innerHTML='<option value="">— Selecciona tu nombre —</option>';
    lista.forEach(t=>{
        const o=document.createElement('option');
        o.value=t;
        const estaOcupado=ocupados.has(t.toUpperCase());
        o.textContent=estaOcupado?`${t} (en uso)`:t;
        o.disabled=estaOcupado;
        o.style.color=estaOcupado?'#ff8a8a':'white';
        sel.appendChild(o);
    });

    sel.addEventListener('change',()=>{
        document.getElementById('start-btn').disabled=!sel.value;
        document.getElementById('error-msg').textContent='';
    });

    const saved=localStorage.getItem('tracking_nombre');
    if(saved){
        const{data}=await sb.from('user_locations').select('nombre').eq('nombre',saved).single();
        if(data){nombre=saved;showActivePanel(saved);startIntervals();}
        else localStorage.removeItem('tracking_nombre');
    }

    _channel=sb.channel('tracking_ocupados')
        .on('postgres_changes',{event:'*',schema:'public',table:'user_locations'},()=>{
            if(document.getElementById('login-panel').style.display!=='none') refreshOcupados(lista);
        })
        .subscribe();
});

async function refreshOcupados(lista){
    const{data:activos}=await sb.from('user_locations').select('nombre');
    const ocupados=new Set((activos||[]).map(u=>u.nombre.toUpperCase()));
    const sel=document.getElementById('nombre-select');
    const currentVal=sel.value;
    sel.innerHTML='<option value="">— Selecciona tu nombre —</option>';
    lista.forEach(t=>{
        const o=document.createElement('option');
        o.value=t;
        const estaOcupado=ocupados.has(t.toUpperCase());
        o.textContent=estaOcupado?`${t} (en uso)`:t;
        o.disabled=estaOcupado;
        o.style.color=estaOcupado?'#ff8a8a':'white';
        if(t===currentVal)o.selected=true;
        sel.appendChild(o);
    });
    document.getElementById('start-btn').disabled=!sel.value||ocupados.has((sel.value||'').toUpperCase());
}

async function startTracking(){
    const sel=document.getElementById('nombre-select');
    const errEl=document.getElementById('error-msg');
    errEl.textContent='';
    if(!sel.value){errEl.textContent='Selecciona tu nombre para continuar.';return;}

    const{data:activo}=await sb.from('user_locations').select('nombre').eq('nombre',sel.value).single();
    if(activo){errEl.textContent='Este nombre ya está siendo usado. Selecciona otro.';return;}

    nombre=sel.value;
    _sendCount=0;
    document.getElementById('start-btn').disabled=true;
    document.getElementById('start-btn').textContent='Activando GPS...';

    // ✅ Si estamos en APK con AndroidInterface, usar GPS nativo
    if (androidAvailable) {
        console.log('🚀 Iniciando rastreo nativo (Android)');
        try {
            AndroidInterface.iniciarRastreo();
            // Mostrar panel activo (el GPS lo maneja Android en segundo plano)
            localStorage.setItem('tracking_nombre', nombre);
            showActivePanel(nombre);
            activateWakeLock();
            // No iniciar intervals del navegador para evitar duplicidad
            document.getElementById('start-btn').textContent='Seguimiento activo';
            return;
        } catch(e) {
            console.error('Error llamando a AndroidInterface:', e);
            androidAvailable = false;
            // Fallback a método del navegador si falla
        }
    }

    // ✅ Fallback: GPS del navegador (código ORIGINAL sin cambios)
    if(!navigator.geolocation){errEl.textContent='Tu dispositivo no soporta GPS.';return;}
    
    navigator.geolocation.getCurrentPosition(
        async(pos)=>{
            await saveLocation(pos.coords.latitude,pos.coords.longitude);
            localStorage.setItem('tracking_nombre',nombre);
            showActivePanel(nombre);
            activateWakeLock();
            startIntervals();
        },
        (err)=>{
            document.getElementById('start-btn').disabled=false;
            document.getElementById('start-btn').textContent='Iniciar seguimiento';
            nombre='';
            if(err.code===1) errEl.textContent='Permiso de ubicación denegado. Actívalo en ajustes.';
            else if(err.code===3){
                errEl.textContent='GPS lento, intentando de nuevo...';
                navigator.geolocation.getCurrentPosition(
                    async(pos)=>{
                        errEl.textContent='';
                        nombre=document.getElementById('nombre-select').value;
                        await saveLocation(pos.coords.latitude,pos.coords.longitude);
                        localStorage.setItem('tracking_nombre',nombre);
                        showActivePanel(nombre);
                        activateWakeLock();
                        startIntervals();
                    },
                    ()=>{errEl.textContent='No se pudo obtener ubicación. Sal a un lugar con mejor señal GPS.';},
                    {enableHighAccuracy:false,timeout:15000,maximumAge:30000}
                );
            }
            else errEl.textContent='No se pudo obtener ubicación. Intenta de nuevo.';
        },
        {enableHighAccuracy:true,timeout:15000,maximumAge:0}
    );
}

function startIntervals(){
    if(watchId!==null){navigator.geolocation.clearWatch(watchId);watchId=null;}
    watchId=navigator.geolocation.watchPosition(
        pos=>saveLocation(pos.coords.latitude,pos.coords.longitude),
        err=>console.warn('watch error:',err),
        {enableHighAccuracy:true,timeout:10000,maximumAge:0}
    );

    if(fallbackInterval) clearInterval(fallbackInterval);
    fallbackInterval=setInterval(()=>{
        if(!nombre) return;
        navigator.geolocation.getCurrentPosition(
            pos=>saveLocation(pos.coords.latitude,pos.coords.longitude),
            err=>console.warn('fallback error:',err),
            {enableHighAccuracy:true,timeout:8000,maximumAge:0}
        );
    },5000);
}

async function saveLocation(lat,lng){
    if(!nombre) return;
    const id=nombre.replace(/\s+/g,'_').toLowerCase();
    const ts=new Date().toISOString();
    const{error}=await sb.from('user_locations').upsert({id,nombre,lat,lng,updated_at:ts});
    if(error){console.error('Error guardando:',error.message);return;}
    _sendCount++;
    document.getElementById('display-coords').textContent=`${lat.toFixed(6)}, ${lng.toFixed(6)}`;
    document.getElementById('last-update').textContent=`${new Date().toLocaleTimeString('es-PE')}`;
    document.getElementById('send-count').textContent=`Envíos: ${_sendCount}`;
}

function showActivePanel(n){
    nombre=n;
    document.getElementById('login-panel').style.display='none';
    document.getElementById('status-panel').style.display='block';
    document.getElementById('display-nombre').textContent=n;
    document.getElementById('start-btn').disabled=false;
    document.getElementById('start-btn').textContent='Iniciar seguimiento';
}

async function activateWakeLock(){
    const msg=document.getElementById('wakelock-msg');
    if('wakeLock' in navigator){
        try{
            _wakeLock=await navigator.wakeLock.request('screen');
            if(msg) msg.textContent='🔒 Pantalla activa (GPS continuo)';
            document.addEventListener('visibilitychange',async()=>{
                if(_wakeLock!==null&&document.visibilityState==='visible'){
                    try{_wakeLock=await navigator.wakeLock.request('screen');}catch(e){}
                }
            });
        }catch(e){if(msg) msg.textContent='⚠ Mantén la pantalla encendida';}
    } else {
        if(msg) msg.textContent='⚠ Mantén la pantalla encendida';
    }
}

async function stopTracking(){
    // ✅ Si estamos en modo nativo, detener vía AndroidInterface
    if (androidAvailable) {
        try {
            AndroidInterface.detenerRastreo();
            console.log('🛑 Deteniendo rastreo nativo');
        } catch(e) {
            console.error('Error deteniendo AndroidInterface:', e);
        }
    }
    
    // ✅ Detener GPS del navegador (código ORIGINAL - siempre ejecutar por seguridad)
    if(watchId!==null){
        try{navigator.geolocation.clearWatch(watchId);}catch(e){}
        watchId=null;
    }
    if(fallbackInterval){clearInterval(fallbackInterval);fallbackInterval=null;}
    if(_wakeLock){try{await _wakeLock.release();}catch(e){}_wakeLock=null;}

    // ✅ Eliminar de Supabase (código ORIGINAL sin cambios)
    if(nombre){
        const id=nombre.replace(/\s+/g,'_').toLowerCase();
        for(let i=0;i<5;i++){
            const{error}=await sb.from('user_locations').delete().eq('id',id);
            if(!error){console.log('Ubicación eliminada OK');break;}
            console.warn('Reintento eliminar:',i+1,error.message);
            await new Promise(r=>setTimeout(r,800));
        }
    }

    // ✅ Limpiar estado (código ORIGINAL sin cambios)
    localStorage.removeItem('tracking_nombre');
    localStorage.removeItem('gps_count');
    nombre='';
    _sendCount=0;

    // ✅ Resetear UI (código ORIGINAL sin cambios)
    document.getElementById('status-panel').style.display='none';
    document.getElementById('login-panel').style.display='block';
    document.getElementById('start-btn').disabled=true;
    document.getElementById('start-btn').textContent='Iniciar seguimiento';
    document.getElementById('display-coords').textContent='Obteniendo GPS...';
    document.getElementById('last-update').textContent='';
    document.getElementById('send-count').textContent='';

    // ✅ Refrescar lista (código ORIGINAL sin cambios)
    await refreshOcupados(_lista);
}

// ── Service Worker (PWA background GPS) ───────────────────────────────────────
if('serviceWorker' in navigator){
    navigator.serviceWorker.register('sw.js').then(reg=>{
        console.log('SW registrado:', reg.scope);
        navigator.serviceWorker.addEventListener('message', event => {
            if(event.data?.type==='REQUEST_GPS' && nombre){
                navigator.geolocation.getCurrentPosition(
                    pos=>saveLocation(pos.coords.latitude,pos.coords.longitude),
                    err=>console.warn('SW GPS error:',err),
                    {enableHighAccuracy:true,timeout:8000,maximumAge:0}
                );
            }
        });
    }).catch(err=>console.warn('SW error:',err));
}

// ── Prompt de instalación ──────────────────────────────────────────────────────
let _installPrompt=null;
window.addEventListener('beforeinstallprompt', e=>{
    e.preventDefault();
    _installPrompt=e;
    const banner=document.createElement('div');
    banner.id='install-banner';
    banner.style.cssText='background:rgba(0,119,182,0.9);border-radius:10px;padding:10px 14px;margin-bottom:12px;font-size:13px;display:flex;align-items:center;justify-content:space-between;gap:10px;';
    banner.innerHTML=`<span>📲 Instala la app para GPS en segundo plano</span><button onclick="installApp()" style="padding:5px 12px;border-radius:6px;border:none;background:white;color:#0077b6;font-weight:bold;font-size:12px;cursor:pointer;width:auto;">Instalar</button>`;
    document.querySelector('.card').insertBefore(banner, document.querySelector('.card').firstChild);
});

async function installApp(){
    if(!_installPrompt) return;
    _installPrompt.prompt();
    const result=await _installPrompt.userChoice;
    if(result.outcome==='accepted'){
        document.getElementById('install-banner')?.remove();
        _installPrompt=null;
    }
}
</script>
</body>
</html>
