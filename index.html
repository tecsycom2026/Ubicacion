<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#1a73e8">
    <meta name="description" content="Tecsycom – Seguimiento en tiempo real de técnicos">
    
    <title>Tecsycom – Compartir Ubicación</title>
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <!-- Supabase JS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f5f5f5;
            color: #333;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Header */
        .header {
            background: linear-gradient(135deg, #1a73e8, #0d47a1);
            color: white;
            padding: 16px;
            text-align: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        
        .header h1 {
            font-size: 1.2rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        
        .header p {
            font-size: 0.85rem;
            opacity: 0.9;
            margin-top: 4px;
        }

        /* Mapa */
        #map {
            flex: 1;
            width: 100%;
            min-height: 300px;
            background: #e0e0e0;
        }

        /* Panel de información */
        .info-panel {
            background: white;
            padding: 12px 16px;
            border-top: 1px solid #e0e0e0;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            font-size: 0.85rem;
        }
        
        .info-item {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }
        
        .info-label {
            color: #666;
            font-size: 0.75rem;
        }
        
        .info-value {
            font-weight: 500;
            color: #333;
        }
        
        .status-badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 0.75rem;
            font-weight: 500;
        }
        
        .status-activo {
            background: #e8f5e9;
            color: #2e7d32;
        }
        
        .status-inactivo {
            background: #ffebee;
            color: #c62828;
        }

        /* Controles */
        .controls {
            background: white;
            padding: 12px 16px;
            border-top: 1px solid #e0e0e0;
            display: flex;
            gap: 12px;
        }
        
        .btn {
            flex: 1;
            padding: 14px;
            border: none;
            border-radius: 8px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        
        .btn-iniciar {
            background: #2e7d32;
            color: white;
        }
        
        .btn-iniciar:active {
            background: #1b5e20;
            transform: scale(0.98);
        }
        
        .btn-detener {
            background: #c62828;
            color: white;
        }
        
        .btn-detener:active {
            background: #b71c1c;
            transform: scale(0.98);
        }
        
        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none !important;
        }

        /* Loading */
        .loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            color: #666;
            font-size: 0.9rem;
        }
        
        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid #e0e0e0;
            border-top-color: #1a73e8;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 12px;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Mensajes */
        .message {
            position: fixed;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            background: #333;
            color: white;
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 0.85rem;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
            z-index: 1000;
        }
        
        .message.show {
            opacity: 1;
        }

        /* Responsive */
        @media (max-width: 480px) {
            .info-panel {
                grid-template-columns: 1fr;
            }
            
            .header h1 {
                font-size: 1.1rem;
            }
        }
    </style>
</head>
<body>

    <!-- Header -->
    <header class="header">
        <h1>🚗 Tecsycom – Compartir Ubicación</h1>
        <p>Seguimiento en tiempo real</p>
    </header>

    <!-- Mapa -->
    <div id="map">
        <div class="loading" id="loading">
            <div class="spinner"></div>
            <div>Cargando técnicos...</div>
        </div>
    </div>

    <!-- Panel de información -->
    <div class="info-panel">
        <div class="info-item">
            <span class="info-label">Estado</span>
            <span class="info-value">
                <span id="estado-seguimiento" class="status-badge status-inactivo">Inactivo</span>
            </span>
        </div>
        <div class="info-item">
            <span class="info-label">Técnico</span>
            <span class="info-value" id="tecnico-nombre">—</span>
        </div>
        <div class="info-item">
            <span class="info-label">Última posición enviada</span>
            <span class="info-value" id="ultima-posicion">—</span>
        </div>
        <div class="info-item">
            <span class="info-label">Precisión</span>
            <span class="info-value" id="precision-gps">—</span>
        </div>
    </div>

    <!-- Controles -->
    <div class="controls">
        <button id="btn-iniciar" class="btn btn-iniciar">
            ▶ Iniciar seguimiento
        </button>
        <button id="btn-detener" class="btn btn-detener" disabled>
            ■ Detener seguimiento
        </button>
    </div>

    <!-- Mensajes flotantes -->
    <div id="message" class="message"></div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <script>
        // ============================================
        // 🔴 CONFIGURACIÓN (EDITAR ESTO)
        // ============================================
        const CONFIG = {
            // Mapa (Lima, Perú)
            centerLat: -12.0464,
            centerLng: -77.0428,
            zoom: 13,
            
            // 🔴 SUPABASE - Reemplaza con tus datos reales
            supabaseUrl: 'https://jxpeztieqwotfgswhzhx.supabase.co',
            supabaseKey: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imp4cGV6dGllcXdvdGZnc3doemh4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzA4MzQ4MDQsImV4cCI6MjA4NjQxMDgwNH0.Hf-lbGlP2OmH7Uh2LNKqwHkwHDp7yQV6O73aXw5NCZk',
            supabaseTable: 'ubicaciones',
            
            // Técnico (Puedes hacerlo dinámico si tienes login)
            tecnicoId: 'TEC-001',
            tecnicoNombre: 'Técnico Asignado'
        };

        // Inicializar Supabase
        const supabase = window.supabase.createClient(CONFIG.supabaseUrl, CONFIG.supabaseKey);

        // Variables globales
        let map, marker;
        let isTracking = false;
        let lastLocation = null;
        let supabaseSyncInterval = null;

        // ============================================
        // INICIALIZACIÓN DEL MAPA
        // ============================================
        function initMap() {
            // Crear mapa centrado en Lima
            map = L.map('map').setView([CONFIG.centerLat, CONFIG.centerLng], CONFIG.zoom);
            
            // Capa de OpenStreetMap
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '© OpenStreetMap contributors',
                maxZoom: 19
            }).addTo(map);
            
            // Icono personalizado para el marcador
            const techIcon = L.divIcon({
                className: 'tech-marker',
                html: `<div style="
                    background: #1a73e8;
                    color: white;
                    width: 32px;
                    height: 32px;
                    border-radius: 50%;
                    display: flex;
                    align-items: center;
                    justify-content: center;
                    font-size: 18px;
                    border: 3px solid white;
                    box-shadow: 0 2px 8px rgba(0,0,0,0.3);
                ">🚗</div>`,
                iconSize: [32, 32],
                iconAnchor: [16, 16]
            });
            
            // Marcador inicial (oculto hasta primera ubicación)
            marker = L.marker([CONFIG.centerLat, CONFIG.centerLng], { icon: techIcon, opacity: 0 }).addTo(map);
            
            // Ocultar loading
            document.getElementById('loading').style.display = 'none';
            
            // Cargar nombre del técnico
            document.getElementById('tecnico-nombre').textContent = CONFIG.tecnicoNombre;
            
            console.log('✅ Mapa inicializado');
        }

        // ============================================
        // ✅ FUNCIÓN PRINCIPAL: Recibe datos de Android Nativo
        // ============================================
        function actualizarUbicacion(lat, lng, accuracy) {
            console.log(`📍 Ubicación recibida: ${lat}, ${lng} (±${accuracy}m)`);
            
            lastLocation = { lat, lng, accuracy, timestamp: Date.now() };
            
            // Actualizar marcador en el mapa
            if (marker) {
                marker.setLatLng([lat, lng]);
                marker.setOpacity(1);
                map.panTo([lat, lng], { animate: true, duration: 0.5 });
            }
            
            // Actualizar UI
            document.getElementById('ultima-posicion').textContent = new Date().toLocaleTimeString('es-PE');
            document.getElementById('precision-gps').textContent = `±${Math.round(accuracy)}m`;
            actualizarUI('Ubicación actualizada', true);
            
            // ✅ Enviar a Supabase
            enviarASupabase(lat, lng, accuracy);
        }

        // ============================================
        // ✅ SUPABASE: Guardar coordenadas
        // ============================================
        async function enviarASupabase(lat, lng, accuracy) {
            // Validar configuración
            if (!CONFIG.supabaseUrl || CONFIG.supabaseUrl.includes('TU_PROYECTO')) {
                console.warn('⚠️ Supabase no configurado correctamente');
                return;
            }
            
            try {
                const { data, error } = await supabase
                    .from(CONFIG.supabaseTable)
                    .insert([{
                        latitude: lat,
                        longitude: lng,
                        accuracy: accuracy,
                        timestamp: new Date().toISOString(),
                        tecnico_id: CONFIG.tecnicoId
                    }]);
                
                if (error) {
                    console.error('❌ Error Supabase:', error.message);
                    mostrarMensaje('⚠️ Error guardando ubicación');
                } else {
                    console.log('✅ Coordenadas guardadas en Supabase');
                }
            } catch (error) {
                console.error('❌ Error de conexión:', error);
            }
        }

        // ============================================
        // UI: Actualizar estado visual
        // ============================================
        function actualizarUI(mensaje, activo = null) {
            const statusEl = document.getElementById('estado-seguimiento');
            if (statusEl) {
                statusEl.textContent = activo === true ? 'Ubicación activa' : activo === false ? 'Inactivo' : mensaje;
                statusEl.className = `status-badge ${activo ? 'status-activo' : 'status-inactivo'}`;
            }
            
            // Actualizar estado de botones
            document.getElementById('btn-iniciar').disabled = activo === true;
            document.getElementById('btn-detener').disabled = activo === false;
            
            // Mostrar mensaje flotante si se proporciona
            if (mensaje && !['Ubicación activa', 'Inactivo'].includes(mensaje)) {
                mostrarMensaje(mensaje);
            }
        }

        function mostrarMensaje(texto) {
            const msg = document.getElementById('message');
            msg.textContent = texto;
            msg.classList.add('show');
            setTimeout(() => msg.classList.remove('show'), 3000);
        }

        // ============================================
        // 📱 ANDROID: Comunicación con Nativo (Kotlin)
        // ============================================
        function iniciarRastreoNativo() {
            if (window.AndroidInterface && typeof AndroidInterface.iniciarRastreo === 'function') {
                AndroidInterface.iniciarRastreo();
                console.log('🚀 Solicitando inicio de rastreo nativo');
                return true;
            }
            return false;
        }

        function detenerRastreoNativo() {
            if (window.AndroidInterface && typeof AndroidInterface.detenerRastreo === 'function') {
                AndroidInterface.detenerRastreo();
                console.log('🛑 Solicitando detención de rastreo nativo');
                return true;
            }
            return false;
        }

        function obtenerEstadoRastreo() {
            if (window.AndroidInterface && typeof AndroidInterface.obtenerEstadoRastreo === 'function') {
                return AndroidInterface.obtenerEstadoRastreo();
            }
            return 'desconocido';
        }

        // ============================================
        // EVENTOS DE LA INTERFAZ
        // ============================================
        document.addEventListener('DOMContentLoaded', function() {
            // Inicializar mapa
            initMap();
            
            // Configurar botones
            const btnIniciar = document.getElementById('btn-iniciar');
            const btnDetener = document.getElementById('btn-detener');
            
            if (btnIniciar) {
                btnIniciar.addEventListener('click', function() {
                    if (iniciarRastreoNativo()) {
                        // Android maneja el GPS nativo
                    } else {
                        // Fallback para pruebas en navegador
                        console.log('⚠️ AndroidInterface no disponible - Modo prueba');
                        mostrarMensaje('Modo prueba: GPS del navegador');
                        iniciarConGeolocationNavegador();
                    }
                });
            }
            
            if (btnDetener) {
                btnDetener.addEventListener('click', function() {
                    if (detenerRastreoNativo()) {
                        actualizarUI('Deteniendo...', null);
                    }
                });
            }
            
            // Verificar si ya hay rastreo activo al cargar
            setTimeout(() => {
                const estado = obtenerEstadoRastreo();
                if (estado === 'activo') {
                    actualizarUI('Ubicación activa', true);
                }
            }, 500);
        });

        // ============================================
        // FALLBACK: Geolocalización del Navegador (Pruebas)
        // ============================================
        function iniciarConGeolocationNavegador() {
            if (!navigator.geolocation) {
                mostrarMensaje('❌ Geolocalización no soportada');
                return;
            }
            
            navigator.geolocation.watchPosition(
                (position) => {
                    const { latitude, longitude, accuracy } = position.coords;
                    actualizarUbicacion(latitude, longitude, accuracy);
                },
                (error) => {
                    console.error('Error de geolocalización:', error);
                    mostrarMensaje('⚠️ Error obteniendo ubicación');
                },
                {
                    enableHighAccuracy: true,
                    timeout: 10000,
                    maximumAge: 0
                }
            );
            
            actualizarUI('Ubicación activa (navegador)', true);
        }

        // ============================================
        // UTILIDADES
        // ============================================
        
        // Prevenir zoom accidental en móviles
        document.addEventListener('touchmove', function(event) {
            if (event.scale !== 1) {
                event.preventDefault();
            }
        }, { passive: false });
        
        // Manejar errores globales
        window.addEventListener('error', function(e) {
            console.error('Error global:', e.message);
        });
        
        // Console log inicial
        console.log('🚗 Tecsycom Tracking App v1.0 - Cargado');
        console.log('📍 Centro: Lima, Perú (-12.0464, -77.0428)');
    </script>
</body>
</html>
