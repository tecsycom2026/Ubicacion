<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PeruFibra – Compartir Ubicación</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        /* ==================== TUS ESTILOS ORIGINALES ==================== */
        /* Mantén aquí todos tus estilos CSS originales */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 20px;
            padding: 30px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }
        .header { text-align: center; margin-bottom: 30px; }
        .header h1 { font-size: 28px; color: #333; margin-bottom: 10px; }
        .header .icon { font-size: 50px; margin-bottom: 10px; }
        .header p { color: #666; font-size: 14px; }
        .status-card {
            background: #f8f9fa;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
            border-left: 5px solid #ccc;
            transition: all 0.3s ease;
        }
        .status-card.active { border-left-color: #28a745; background: #e8f5e9; }
        .status-card.error { border-left-color: #dc3545; background: #ffe6e6; }
        .status-card.warning { border-left-color: #ffc107; background: #fff8e1; }
        .status-text { font-size: 18px; font-weight: bold; color: #333; margin-bottom: 15px; }
        .info-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #eee;
            font-size: 14px;
        }
        .info-row:last-child { border-bottom: none; }
        .info-label { color: #666; }
        .info-value { color: #333; font-weight: 600; }
        .btn {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 10px;
        }
        .btn-start { background: #28a745; color: white; }
        .btn-start:hover { background: #218838; }
        .btn-stop { background: #dc3545; color: white; display: none; }
        .btn-stop:hover { background: #c82333; }
        .btn:disabled { opacity: 0.6; cursor: not-allowed; }
        .loading { text-align: center; color: #666; padding: 20px; }
        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .connection-status { text-align: center; font-size: 12px; color: #999; margin-top: 15px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="icon">🚗</div>
            <h1>Compartir Ubicación</h1>
            <p>PeruFibra – Seguimiento en tiempo real</p>
        </div>

        <div id="loading" class="loading">
            <div class="spinner"></div>
            <p>Cargando técnicos...</p>
        </div>

        <div id="mainContent" style="display: none;">
            <div id="statusCard" class="status-card">
                <div id="statusText" class="status-text">■ Detenido</div>
                
                <div class="info-row">
                    <span class="info-label">Técnico</span>
                    <span id="tecnicoName" class="info-value">—</span>
                </div>
                
                <div class="info-row">
                    <span class="info-label">Coordenadas</span>
                    <span id="coordinates" class="info-value">Obteniendo GPS...</span>
                </div>
                
                <div class="info-row">
                    <span class="info-label">Última actualización</span>
                    <span id="lastUpdate" class="info-value">—</span>
                </div>
                
                <div class="info-row">
                    <span class="info-label">Envíos</span>
                    <span id="sendCount" class="info-value">0</span>
                </div>
            </div>

            <button id="btnStart" class="btn btn-start">▶ Iniciar seguimiento</button>
            <button id="btnStop" class="btn btn-stop">■ Detener seguimiento</button>

            <div class="connection-status">
                <span id="connectionStatus">📡 Estado: Esperando</span>
            </div>
        </div>
    </div>

    <script>
        // ==================== CONFIGURACIÓN SUPABASE ====================
        const SUPABASE_URL = 'https://jxpeztieqwotfgswhzhx.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imp4cGV6dGllcXdvdGZnc3doemh4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzA4MzQ4MDQsImV4cCI6MjA4NjQxMDgwNH0.Hf-lbGlP2OmH7Uh2LNKqwHkwHDp7yQV6O73aXw5NCZk';
        
        const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

        // Variables originales (SIN CAMBIOS)
        let watchId=null, fallbackInterval=null, nombre='', _channel=null, _lista=[], _wakeLock=null, _sendCount=0;
        
        // ✅ Variables NUEVAS para Android Nativo (no interfieren con lo original)
        let androidAvailable = false;
        
        // ============================================
        // ✅ FUNCIÓN NUEVA: Recibir coordenadas desde Android Nativo
        // (Se llama desde Kotlin vía webView.loadUrl("javascript:..."))
        // ============================================
        function actualizarUbicacion(lat, lng, accuracy) {
            console.log(`📍 Android Nativo: ${lat}, ${lng} (±${accuracy}m)`);
            // Reutiliza tu función original saveLocation para mantener compatibilidad con Supabase
            if (nombre) {
                saveLocation(lat, lng);
            }
        }
        
        // ==================== VARIABLES GLOBALES ====================
        let watchId = null;
        let isTracking = false;
        let sendCount = 0;
        let tecnicoData = null;
        let pendingLocations = [];
        let reconnectAttempts = 0;
        const MAX_RECONNECT_ATTEMPTS = 5;

        // ==================== ELEMENTOS DEL DOM ====================
        const loadingEl = document.getElementById('loading');
        const mainContentEl = document.getElementById('mainContent');
        const statusCardEl = document.getElementById('statusCard');
        const statusTextEl = document.getElementById('statusText');
        const tecnicoNameEl = document.getElementById('tecnicoName');
        const coordinatesEl = document.getElementById('coordinates');
        const lastUpdateEl = document.getElementById('lastUpdate');
        const sendCountEl = document.getElementById('sendCount');
        const btnStart = document.getElementById('btnStart');
        const btnStop = document.getElementById('btnStop');
        const connectionStatusEl = document.getElementById('connectionStatus');

        // ==================== FUNCIONES ORIGINALES DE SUPABASE ====================
        // ⚠️ PEGA AQUÍ TU FUNCIÓN sbLoadG ORIGINAL COMPLETA
        async function sbLoadG(t){
            const{data,error}=await sb.from(t).select('data').eq('id','global').single();
            if(error)return null;
            return data?.data??null;
        }
        
        window.addEventListener('load',async()=>{
            // ✅ Detectar si estamos en APK con AndroidInterface (nuevo, no afecta UI)
            if (window.AndroidInterface && typeof AndroidInterface.iniciarRastreo === 'function') {
                androidAvailable = true;
                console.log('✅ AndroidInterface detectado - GPS nativo disponible');
            }
            
            const fbTL=await sbLoadG('technician_list');
            const lista=Array.isArray(fbTL)?fbTL.sort():[];
            _lista=lista;
        
            const{data:activos}=await sb.from('user_locations').select('nombre');
            const ocupados=new Set((activos||[]).map(u=>u.nombre.toUpperCase()));
        
            const sel=document.getElementById('nombre-select');
            sel.innerHTML='<option value="">— Selecciona tu nombre —</option>';
            lista.forEach(t=>{
                const o=document.createElement('option');
                o.value=t;
                const estaOcupado=ocupados.has(t.toUpperCase());
                o.textContent=estaOcupado?`${t} (en uso)`:t;
                o.disabled=estaOcupado;
                o.style.color=estaOcupado?'#ef4444':'#1f2937';
                sel.appendChild(o);
            });
        
            sel.addEventListener('change',()=>{
                document.getElementById('start-btn').disabled=!sel.value;
                document.getElementById('error-msg').textContent='';
            });
        
            const saved=localStorage.getItem('tracking_nombre');
            if(saved){
                const{data}=await sb.from('user_locations').select('nombre').eq('nombre',saved).single();
                if(data){nombre=saved;showActivePanel(saved);startIntervals();}
                else localStorage.removeItem('tracking_nombre');
            }
        
            _channel=sb.channel('tracking_ocupados')
                .on('postgres_changes',{event:'*',schema:'public',table:'user_locations'},()=>{
                    if(document.getElementById('login-panel').style.display!=='none') refreshOcupados(lista);
                })
                .subscribe();
        });
        // ==================== SISTEMA DE RECONEXIÓN AUTOMÁTICA ====================
        // 🔥 NUEVO: Detecta cuando la pantalla se enciende y reinicia el GPS
        function configurarEventos() {
            btnStart.addEventListener('click', iniciarSeguimiento);
            btnStop.addEventListener('click', detenerSeguimiento);
            
            // 🔥 RECONEXIÓN AL VOLVER A PRIMER PLANO
            document.addEventListener('visibilitychange', () => {
                if (document.visibilityState === 'visible') {
                    console.log('📱 App volvió a primer plano - Verificando GPS...');
                    actualizarEstadoConexion();
                    
                    if (isTracking) {
                        setTimeout(() => {
                            reiniciarGPS();
                        }, 500);
                    }
                }
            });

            // Detectar interacción del usuario
            document.addEventListener('click', () => {
                if (isTracking) {
                    actualizarEstadoConexion();
                }
            });

            // Verificar conexión periódicamente
            setInterval(verificarConexion, 10000);
            
            // Para dispositivos móviles (evento nativo de reanudar)
            document.addEventListener('resume', () => {
                if (isTracking) {
                    console.log('🔄 App reanudada - Reiniciando GPS');
                    reiniciarGPS();
                }
            });
        }

        // ==================== LÓGICA DE GPS ====================
        function iniciarSeguimiento() {
            if (isTracking) return;
            
            isTracking = true;
            sendCount = 0;
            reconnectAttempts = 0;
            actualizarContador();
            
            actualizarUI('active', '▶ Ubicación activa', 'green');
            btnStart.style.display = 'none';
            btnStop.style.display = 'block';
            
            iniciarGPS();
            actualizarEstadoConexion();
            
            console.log('✅ Seguimiento iniciado');
        }

        function detenerSeguimiento() {
            if (!isTracking) return;
            
            isTracking = false;
            
            if (watchId !== null) {
                navigator.geolocation.clearWatch(watchId);
                watchId = null;
            }
            
            actualizarUI('default', '■ Detenido', '#333');
            btnStart.style.display = 'block';
            btnStop.style.display = 'none';
            coordinatesEl.textContent = '—';
            connectionStatusEl.textContent = '📡 Estado: Detenido';
            
            console.log('⏹ Seguimiento detenido');
        }

        function iniciarGPS() {
            if (!('geolocation' in navigator)) {
                actualizarUI('error', '⚠ GPS no disponible', 'red');
                return;
            }

            // 🔥 CONFIGURACIÓN OPTIMIZADA PARA BATERÍA
            const opcionesGPS = {
                enableHighAccuracy: false, // Usa redes (WiFi/Móvil)
                timeout: 10000,
                maximumAge: 30000
            };

            watchId = navigator.geolocation.watchPosition(
                (position) => {
                    const coords = {
                        latitude: position.coords.latitude,
                        longitude: position.coords.longitude,
                        accuracy: position.coords.accuracy,
                        timestamp: new Date().toISOString()
                    };
                    
                    actualizarCoordenadas(coords);
                    enviarUbicacion(coords);
                    reconnectAttempts = 0;
                },
                (error) => {
                    console.error('❌ Error GPS:', error.message);
                    let mensaje = '⚠ Error de señal';
                    
                    switch(error.code) {
                        case error.PERMISSION_DENIED:
                            mensaje = '⚠ Permiso denegado';
                            break;
                        case error.POSITION_UNAVAILABLE:
                            mensaje = '⚠ Señal no disponible';
                            break;
                        case error.TIMEOUT:
                            mensaje = '⚠ Tiempo de espera agotado';
                            break;
                    }
                    
                    actualizarUI('warning', mensaje, 'orange');
                },
                opcionesGPS
            );
        }

        // 🔥 FUNCIÓN CLAVE: REINICIO AUTOMÁTICO DEL GPS
        function reiniciarGPS() {
            if (!isTracking) return;
            
            console.log('🔄 Reiniciando GPS para recuperar conexión...');
            
            if (watchId !== null) {
                navigator.geolocation.clearWatch(watchId);
                watchId = null;
            }
            
            setTimeout(() => {
                iniciarGPS();
                actualizarUI('active', '▶ Reconectado', 'green');
            }, 300);
        }

        // ==================== ENVÍO A SUPABASE ====================
        function enviarUbicacion(coords) {
            pendingLocations.push(coords);
            
            if (navigator.onLine) {
                procesarColaEnvios();
            }
        }

        async function procesarColaEnvios() {
            if (pendingLocations.length === 0) return;
            
            const datos = pendingLocations.shift();
            
            try {
                // ⚠️ VERIFICA QUE ESTA ESTRUCTURA COINCIDA CON TU TABLA ORIGINAL
                const { data, error } = await supabase
                    .from('ubicaciones')
                    .insert({
                        tecnico_id: tecnicoData?.id,
                        latitude: datos.latitude,
                        longitude: datos.longitude,
                        accuracy: datos.accuracy,
                        timestamp: datos.timestamp,
                        created_at: new Date().toISOString()
                    });
                
                if (error) throw error;
                
                sendCount++;
                actualizarContador();
                console.log('✅ Datos enviados a Supabase');
                
            } catch (error) {
                console.error('❌ Error enviando a Supabase:', error);
                pendingLocations.unshift(datos);
                
                reconnectAttempts++;
                if (reconnectAttempts >= MAX_RECONNECT_ATTEMPTS) {
                    actualizarUI('error', '⚠ Error de conexión', 'red');
                }
            }
        }

        // ==================== ACTUALIZACIÓN DE UI ====================
        function actualizarUI(clase, texto, color) {
            statusCardEl.className = 'status-card ' + clase;
            statusTextEl.textContent = texto;
            statusTextEl.style.color = color;
        }

        function actualizarCoordenadas(coords) {
            coordinatesEl.textContent = `${coords.latitude.toFixed(6)}, ${coords.longitude.toFixed(6)}`;
            lastUpdateEl.textContent = new Date().toLocaleTimeString();
            connectionStatusEl.textContent = '📡 Estado: Enviando datos';
            connectionStatusEl.style.color = 'green';
        }

        function actualizarContador() {
            sendCountEl.textContent = sendCount;
        }

        // ==================== CONEXIÓN ====================
        function verificarConexion() {
            if (navigator.onLine) {
                connectionStatusEl.textContent = '📡 Estado: En línea';
                connectionStatusEl.style.color = 'green';
                procesarColaEnvios();
            } else {
                connectionStatusEl.textContent = '📡 Estado: Sin conexión';
                connectionStatusEl.style.color = 'orange';
            }
        }

        function actualizarEstadoConexion() {
            verificarConexion();
        }

        // ==================== LIMPIEZA ====================
        window.addEventListener('beforeunload', () => {
            if (watchId !== null) {
                navigator.geolocation.clearWatch(watchId);
            }
        });
    </script>
</body>
</html>
